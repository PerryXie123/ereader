[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ereader-eink-simulator"
version = "0.1.0"
description = "Raspberry Pi-friendly e-ink reader simulator with a virtual framebuffer architecture."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "pygame>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

